# Cloud Build Configuration for WAPCentral Microservices
# Phase 13 — Production Release
steps:
  # Step 1: Build the microservice container image using monorepo multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-service'
    args:
      - 'build'
      - '--build-arg'
      - 'SERVICE=${_SERVICE}'
      - '-t'
      - '${_IMAGE_TAG}'
      - '.'

  # Step 2: Push the container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_IMAGE_TAG}'

images:
  - '${_IMAGE_TAG}'

substitutions:
  _SERVICE: 'admin-api'
  _IMAGE_TAG: 'us-central1-docker.pkg.dev/wapcentral-prod/wapcentral/admin-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
