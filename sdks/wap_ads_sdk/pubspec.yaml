name: wap_ads_sdk
description: >
  WebAppyPie Ads SDK for Flutter.
  Unified wrapper for Google AdMob, Meta Audience Network, AppLovin MAX, and WAPAds (own promo hook).
  Fully decoupled from wap_promo_sdk.
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # Third-party ad SDKs will be added here in Phase 9:
  # google_mobile_ads: ^5.0.0
  # meta_audience_network: ^6.0.0
  # applovin_max: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  # No assets or plugins in Phase 0 stub
