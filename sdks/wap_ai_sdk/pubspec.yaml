name: wap_ai_sdk
description: >
  Unified AI Service SDK for WebAppyPie applications.
  Provides text generation, vision, classification, summarization, translation,
  and structured extraction behind WAPCentral service layer.
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  wap_core_sdk:
    path: ../wap_core_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.2.0
