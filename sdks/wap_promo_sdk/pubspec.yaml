name: wap_promo_sdk
description: >
  WebAppyPie Promotion SDK for Flutter.
  Delivers non-blocking, cache-first self-promotion campaigns from the WAPCentral platform.
  Handles local caching, background refresh, HMAC validation, frequency capping, and analytics.
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  # No assets or plugins in Phase 0 stub
